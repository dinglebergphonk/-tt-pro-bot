
name: hits
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: hits
  cancel-in-progress: false

jobs:
  hit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y >/dev/null
          npm i -D playwright@1.49.0
          npx playwright install --with-deps chromium
      - run: node bot/hit.mjs
        env:
          REFERRAL_LINKS: ${{ vars.REFERRAL_LINKS || 'https://pro.tiktok.com/t/ZP9PBFN1ALNQb-LMcna/' }}
          HITS_PER_LINK: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_id }}
          path: shots/
          retention-days: 3
